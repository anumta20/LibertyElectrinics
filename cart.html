<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Cart - Liberty Electronics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Theme CSS -->
  <link rel="stylesheet" href="/Css/theme.css">

  <!-- Cart CSS -->
  <link rel="stylesheet" href="/Css/cart.css">
</head>

<body>

  <div id="header"></div>

  <!-- CART PAGE -->
  <section class="py-5">
    <div class="container">

      <div class="text-center mb-5">
        <h1 class="section-title">Your Cart</h1>
        <p class="section-subtitle mx-auto">
          Review your selected products and proceed to checkout.
        </p>
      </div>

      <div class="row g-4">

        <!-- CART ITEMS -->
        <div class="col-lg-8">

          <div class="cart-box">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-cart-shopping me-2"></i>Cart Items</h4>

            <div id="cartItemsContainer">
              <!-- Items will load here -->
            </div>

            <div id="emptyCartBox" class="empty-cart d-none">
              <i class="fa-solid fa-bag-shopping"></i>
              <h5 class="fw-bold mt-3">Your cart is empty</h5>
              <p class="text-muted">Looks like you haven’t added any products yet.</p>
              <a href="/html/shop.html" class="btn btn-dark mt-2">Go to Shop</a>
            </div>

          </div>

        </div>

        <!-- CART SUMMARY -->
        <div class="col-lg-4">

          <div class="cart-box sticky-summary">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-receipt me-2"></i>Summary</h4>

            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Subtotal</span>
              <span id="subtotalText" class="fw-semibold">Rs. 0</span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Delivery</span>
              <span id="deliveryText" class="fw-semibold">Rs. 0</span>
            </div>

            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted">Tax</span>
              <span id="taxText" class="fw-semibold">Rs. 0</span>
            </div>

            <div class="total-box d-flex justify-content-between align-items-center mb-3">
              <span class="fw-bold fs-5">Total</span>
              <span id="totalText" class="fw-bold fs-5">Rs. 0</span>
            </div>

            <button class="btn btn-dark w-100" id="checkoutBtn">
              <i class="fa-solid fa-credit-card me-2"></i>Proceed to Payment
            </button>

            <button class="btn btn-outline-dark w-100 mt-2" id="clearCartBtn">
              <i class="fa-solid fa-trash me-2"></i>Clear Cart
            </button>

          </div>

        </div>

      </div>

    </div>
  </section>

  <div id="footer"></div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Layout -->
  <script src="/Javascript/layout.js"></script>

  <!-- Cart JS -->
  <script src="/Javascript/cart.js"></script>

</body>

</html>
