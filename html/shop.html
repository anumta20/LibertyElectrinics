<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Liberty Electronics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Theme CSS -->
  <link rel="stylesheet" href="/Css/theme.css">
  <link rel="stylesheet" href="/Css/shop.css">

  <style>
    #compareFloatingBtn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 9999;
      border-radius: 50px;
      padding: 12px 20px;
      font-weight: 700;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.25);
      display: none;
    }

    .compare-check {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #ddd;
      box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .compare-check input {
      margin-right: 6px;
    }

    .product-card {
      position: relative;
    }
  </style>
</head>

<body>

  <div id="header"></div>

  <!-- SHOP PAGE -->
  <section class="py-5">
    <div class="container-fluid px-lg-5 px-3">

      <div class="text-center mb-4">
        <h1 class="section-title">Shop</h1>
        <p class="section-subtitle mx-auto">
          Browse the latest smartphones and choose the best device for your lifestyle.
        </p>
      </div>

      <div class="row g-4">

        <!-- FILTER SIDEBAR -->
        <div class="col-lg-3">
          <div class="about-box">
            <h4 class="fw-bold mb-3">Filters</h4>

            <!-- SEARCH -->
            <label class="fw-bold mb-2">Search</label>
            <input type="text" id="searchFilter" class="form-control mb-3" placeholder="Search phone name...">

            <!-- BRAND FILTER -->
            <label class="fw-bold mb-2">Brand</label>
            <select id="brandFilter" class="form-select mb-3">
              <option value="All">All Brands</option>
              <option value="Samsung">Samsung</option>
              <option value="Apple">Apple</option>
              <option value="Google">Google</option>
              <option value="Oppo">Oppo</option>
              <option value="Realme">Realme</option>
              <option value="Xiaomi">Xiaomi</option>
            </select>

            <!-- PRICE FILTER -->
            <label class="fw-bold mb-2">Max Price</label>
            <input type="number" id="priceFilter" class="form-control mb-3" placeholder="Enter max price">

            <!-- STORAGE FILTER -->
            <label class="fw-bold mb-2">Storage</label>
            <select id="storageFilter" class="form-select mb-3">
              <option value="All">All Storage</option>
              <option value="128">128GB</option>
              <option value="256">256GB</option>
              <option value="512">512GB</option>
              <option value="1024">1TB</option>
            </select>

            <button id="resetFiltersBtn" class="btn btn-dark w-100 mt-2">
              Reset Filters
            </button>
          </div>
        </div>

        <!-- PRODUCTS AREA -->
        <div class="col-lg-9">

          <!-- BRAND INTRO BOX (FIXED CLASS) -->
          <div id="brandIntroBox" class="brand-intro-box mb-4 d-none">
            <h4 id="brandIntroTitle" class="fw-bold mb-2"></h4>
            <p id="brandIntroText" class="text-muted mb-0"></p>
          </div>

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <p class="text-muted mb-0" id="productCountText">Showing 0 products</p>

            <select id="sortFilter" class="form-select" style="max-width: 220px;">
              <option value="featured">Featured</option>
              <option value="low-high">Price: Low to High</option>
              <option value="high-low">Price: High to Low</option>
              <option value="newest">Newest</option>
            </select>
          </div>

          <!-- PRODUCTS GRID -->
          <div class="row g-4" id="productsContainer"></div>

        </div>

      </div>
    </div>
  </section>

  <!-- COMPARE FLOATING BUTTON -->
  <button id="compareFloatingBtn" class="btn btn-warning">
    <i class="fa-solid fa-code-compare me-2"></i> Compare (<span id="compareCount">0</span>)
  </button>

  <div id="footer"></div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/Javascript/layout.js"></script>
  <script src="/Javascript/products.js"></script>
  <script src="/Javascript/shop.js"></script>

</body>

</html>
