<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="/Css/theme.css">
  <link rel="stylesheet" href="/Css/shop.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3">
    <div class="container-fluid px-lg-5 px-3">
      <a class="navbar-brand fw-bold" href="/html/index.html">Liberty Electronics</a>

      <div class="ms-auto d-flex gap-2">
        <a href="/html/shop.html" class="btn btn-outline-dark">⬅ Back</a>
        <a href="/html/Shop/cart.html" class="btn btn-dark">🛒 Cart</a>
      </div>
    </div>
  </nav>

  <!-- PRODUCT DETAILS -->
  <div class="container my-5">

    <div class="row g-5 align-items-center">

      <!-- IMAGE -->
      <div class="col-lg-6 text-center">
        <div class="p-4 bg-light rounded shadow-sm">
          <img id="productImg" src="" class="img-fluid" style="max-height: 420px; object-fit: contain;">
        </div>
      </div>

      <!-- DETAILS -->
      <div class="col-lg-6">
        <h2 class="fw-bold" id="productName"></h2>
        <p class="text-muted" id="productBrand"></p>

        <h4 class="fw-bold text-success mb-3">
          Rs. <span id="productPrice"></span> PKR
        </h4>

        <!-- STORAGE -->
        <h6 class="fw-bold">Storage Options</h6>
        <select id="storageSelect" class="form-select mb-4" style="max-width: 250px;"></select>

        <!-- COLORS -->
        <h6 class="fw-bold">Choose Color</h6>
        <div class="d-flex flex-wrap gap-2 mb-4" id="colorBox"></div>

        <!-- ADD TO CART -->
        <button class="btn btn-dark w-100 py-2 fw-semibold" id="addToCartBtn">
          Add to Cart
        </button>
      </div>
    </div>

    <!-- SPECS -->
    <div class="mt-5">
      <h3 class="fw-bold mb-3">Specifications</h3>

      <div class="table-responsive">
        <table class="table table-bordered">
          <tbody id="specsTable"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- JS -->
  <script src="/Javascript/products.js"></script>
  <script src="/Javascript/product.js"></script>

</body>
</html>
