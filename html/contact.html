<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Liberty Electronics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Theme CSS -->
  <link rel="stylesheet" href="/Css/theme.css">
</head>

<body>

  <div id="header"></div>

  <!-- CONTACT SECTION -->
  <section class="py-5">
    <div class="container-fluid px-lg-5 px-3">

      <div class="text-center mb-5">
        <h1 class="section-title">Contact Us</h1>
        <p class="section-subtitle mx-auto">
          Need help choosing the right smartphone? Contact Liberty Electronics anytime.
        </p>
      </div>

      <div class="row g-4">

        <!-- CONTACT INFO -->
        <div class="col-lg-5">
          <div class="about-box">
            <h4 class="fw-bold mb-3">Our Store Details</h4>

            <p class="text-muted mb-2">
              <i class="fa-solid fa-location-dot me-2"></i>
              Karachi, Pakistan
            </p>

            <p class="text-muted mb-2">
              <i class="fa-solid fa-phone me-2"></i>
              +92 300 0000000
            </p>

            <p class="text-muted mb-4">
              <i class="fa-solid fa-envelope me-2"></i>
              <a href="mailto:liberty@electronics.com" class="text-decoration-none">
                liberty@electronics.com
              </a>
            </p>

            <h5 class="fw-bold">Working Hours</h5>
            <p class="text-muted mb-0">
              Monday - Saturday: 10:00 AM - 10:00 PM <br>
              Sunday: 12:00 PM - 8:00 PM
            </p>
          </div>
        </div>

        <!-- GOOGLE MAP -->
        <div class="col-lg-7">
          <div class="about-box p-0 overflow-hidden">
            <iframe
              src="https://www.google.com/maps?q=Karachi%20Pakistan&output=embed"
              width="100%"
              height="420"
              style="border:0;"
              allowfullscreen=""
              loading="lazy">
            </iframe>
          </div>
        </div>

      </div>

    </div>
  </section>

<div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/Javascript/layout.js"></script>

</body>

</html>
